; baremetal_ldscript: no framework. Own vector table and Reset_Handler (src/startup.c), own linker
; script (ld/stm32f411ce.ld via board_build.ldscript), register-level blink of PC13 on the BlackPill.
; PlatformIO only supplies the arm-none-eabi toolchain and the board's cpu flags.
[platformio]
default_envs = blackpill

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
upload_protocol = dfu
board_build.ldscript = ld/stm32f411ce.ld
build_flags = -Os -ffunction-sections -fdata-sections -Wall -Wextra -Werror
extra_scripts = pre:ld/flags.py
