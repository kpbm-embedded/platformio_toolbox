; unit_test_native: a portable ring-buffer library with Unity unit tests that run on the host
; (`./pio-box utest unit_test_native -e native`, gcc from the pixi env) and the same library
; built into firmware for the Nano and the BlackPill (`./pio-box build unit_test_native`).
[platformio]
default_envs = native

[env]
test_framework = unity

[env:native]
platform = platformio/native@1.2.1
build_flags = -std=c11 -Wall -Wextra -Werror

[env:nano]
platform = platformio/atmelavr@5.3.0
board = nanoatmega328
framework = arduino

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
framework = arduino
