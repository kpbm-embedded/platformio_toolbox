; esp32_freertos: FreeRTOS on the Arduino-ESP32 core (3.3.12): a sensor task feeds a queue, a logger
; task drains it, a mutex guards Serial, an event group signals "ready". On the dual-core ESP32-S3 the
; tasks are pinned to core 0 / core 1; the single-core ESP32-C3 (RISC-V) builds the same code.
[platformio]
default_envs = esp32s3, esp32c3

[env]
platform = platformio/espressif32@8.0.0
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = weactstudio_esp32c3coreboard
