; library_package: a reusable library (library.json + src/) developed like a project.
;   ./pio-box utest library_package -e native     Unity tests of the library on the host
;   pio ci (in example.sh)                        builds examples/checksum against the library for boards
;   pio pkg pack                                  the .tar.gz you would publish (test/ and this file excluded)
; src/ is the library and also the project's source here, so the tests build it (test_build_src).
[platformio]
default_envs = native

[env]
test_framework = unity
test_build_src = yes

[env:native]
platform = platformio/native@1.2.1
build_flags = -std=c11 -Wall -Wextra -Werror

[env:nano]
platform = platformio/atmelavr@5.3.0
board = nanoatmega328
framework = arduino

[env:pico]
platform = platformio/raspberrypi@1.20.0
board = pico
framework = arduino
