; compiledb: compile_commands.json for clangd / IDEs (`-t compiledb`), written into the build folder of
; each env (scripts/compiledb_path.py) instead of the project root, so the source tree stays clean.
; Point clangd at it with `CompilationDatabase: <workspace>/build/<env>` in .clangd, or symlink it.
[platformio]
default_envs = blackpill, pico, native

[env]
extra_scripts = pre:scripts/compiledb_path.py

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu

[env:pico]
platform = platformio/raspberrypi@1.20.0
board = pico
framework = arduino

[env:native]
platform = platformio/native@1.2.1
