; static_check: `pio check` with cppcheck and clang-tidy (versions pinned in config/tools.tsv).
;   clean   src/ must have no defect of any severity (the gate you would put in CI)
;   buggy   buggy/ holds three planted bugs; the example asserts that both tools report them
; check_skip_packages keeps framework headers out of the analysis. The analysed native code includes no
; system headers on purpose: tool-clangtidy ships no clang resource headers (stddef.h ...) and PlatformIO
; passes gcc 14's predefined macros, so libc headers fail to parse, and PlatformIO then still prints
; "No defects found". The example checks that clang-tidy really reports the planted bugs.
; ./pio-box check static_check -e clean
[platformio]
default_envs = clean

[env]
platform = platformio/native@1.2.1
check_tool = cppcheck, clangtidy
check_skip_packages = yes
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr
    clangtidy: --checks=-*,bugprone-*,clang-analyzer-*,cert-*,-cert-err33-c,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling

[env:clean]
check_src_filters = +<src/>

[env:buggy]
check_src_filters = +<buggy/>
check_severity = high, medium

[env:blackpill]
; same src/ as firmware, framework headers skipped (with them cppcheck 2.11 aborts on the STM32 core;
; clang-tidy would need the arm toolchain headers and target flags)
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
framework = arduino
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/>
check_flags = cppcheck: --enable=warning,performance,portability --inline-suppr
