; @NAME@ (./pio-box new extra_scripts @NAME@): SCons hooks around the build.
;   pre:scripts/version.py   reads VERSION, adds -DFW_VERSION / -DFW_ENV before anything compiles
;   post:scripts/manifest.py after linking writes manifest.json (version, env, sha256, sizes) next to
;                            the firmware and adds a custom target: ./pio-box build extra_scripts -t fwinfo
[platformio]
default_envs = blackpill, pico

[env]
framework = arduino
extra_scripts =
    pre:scripts/version.py
    post:scripts/manifest.py

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
upload_protocol = dfu

[env:pico]
platform = platformio/raspberrypi@1.20.0
board = pico
