; @NAME@ (./pio-box new size_budget @NAME@): two ways to stop a build that grows too big.
;   custom_flash_budget / custom_ram_budget + scripts/budget.py  your own limits, checked after linking
;   board_upload.maximum_size                                    PlatformIO's own check against the board
; nano fits; nano_tight has a 1 KiB budget and must fail; nano_small_board pretends the chip has 1.5 KiB of flash.
; ./pio-box build size_budget -e nano -t size   prints the usual RAM/Flash bars
[platformio]
default_envs = nano

[env]
platform = platformio/atmelavr@5.3.0
board = nanoatmega328
framework = arduino
extra_scripts = post:scripts/budget.py

[env:nano]
custom_flash_budget = 4096
custom_ram_budget = 512

[env:nano_tight]
custom_flash_budget = 1024
custom_ram_budget = 512

[env:nano_small_board]
extra_scripts =
board_upload.maximum_size = 1536

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
custom_flash_budget = 32768
custom_ram_budget = 4096
