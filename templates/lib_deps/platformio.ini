; @NAME@ (./pio-box new lib_deps @NAME@): an external library from the PlatformIO registry, pinned to an exact version
; (owner/name@version), installed into the workspace by `./pio-box install` / the first build.
; The config parser is a local library (lib/config) that depends on ArduinoJson; it is unit-tested
; on the host and linked into ESP32-C3 and BlackPill firmware.
[platformio]
default_envs = native

[env]
lib_deps = bblanchon/ArduinoJson@7.4.3
test_framework = unity

[env:native]
platform = platformio/native@1.2.1
build_flags = -std=gnu++17 -Wall -Wextra

[env:esp32c3]
platform = platformio/espressif32@8.0.0
board = weactstudio_esp32c3coreboard
framework = arduino

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
