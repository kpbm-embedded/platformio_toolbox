; @NAME@ (./pio-box new multi_board @NAME@): one source tree for eight targets. Shared settings live in [common] sections and
; are reused with `extends`; each env adds its own -D flags (board name, LED pin, feature switches),
; `build_unflags` drops a default, `build_src_filter` adds a board-only file. ./pio-box build @NAME@
[platformio]
default_envs = blackpill, weact_g431, weact_h743, pico, esp32s3, esp32c3, nano, native

[common]
build_flags = -DFW_NAME=\"@NAME@\" -Wall
[common_stm32]
extends = common
platform = platformio/ststm32@20.0.0
framework = arduino
upload_protocol = dfu
build_unflags = -Os
build_flags = ${common.build_flags} -O2 -DFAMILY=\"stm32\"

[env:blackpill]
extends = common_stm32
board = blackpill_f411ce
build_flags = ${common_stm32.build_flags} -DBOARD_TAG=\"blackpill_f411\" -DLED=PC13 -DLED_ACTIVE_LOW=1

[env:weact_g431]
extends = common_stm32
board = genericSTM32G431CB
build_flags = ${common_stm32.build_flags} -DBOARD_TAG=\"weact_g431\" -DLED=PC6 -DLED_ACTIVE_LOW=0 -DHAS_FDCAN=1
build_src_filter = +<*> +<../extra/fdcan_note.cpp>

[env:weact_h743]
extends = common_stm32
board = weact_mini_h743vitx
build_flags = ${common_stm32.build_flags} -DBOARD_TAG=\"weact_h743\" -DLED=PE3 -DLED_ACTIVE_LOW=0

[env:pico]
extends = common
platform = platformio/raspberrypi@1.20.0
framework = arduino
board = pico
build_flags = ${common.build_flags} -DFAMILY=\"rp2040\" -DBOARD_TAG=\"pico\" -DLED=LED_BUILTIN -DLED_ACTIVE_LOW=0

[env:esp32s3]
extends = common
platform = platformio/espressif32@8.0.0
framework = arduino
board = esp32-s3-devkitc-1
build_flags = ${common.build_flags} -DFAMILY=\"esp32\" -DBOARD_TAG=\"esp32s3\" -DLED=2 -DLED_ACTIVE_LOW=0

[env:nano]
extends = common
platform = platformio/atmelavr@5.3.0
framework = arduino
board = nanoatmega328
build_flags = ${common.build_flags} -DFAMILY=\"avr\" -DBOARD_TAG=\"nano\" -DLED=LED_BUILTIN -DLED_ACTIVE_LOW=0

[env:esp32c3]
extends = common
platform = platformio/espressif32@8.0.0
framework = arduino
board = weactstudio_esp32c3coreboard
build_flags = ${common.build_flags} -DFAMILY=\"esp32\" -DBOARD_TAG=\"esp32c3\" -DLED=8 -DLED_ACTIVE_LOW=1

[env:native]
extends = common
platform = platformio/native@1.2.1
build_flags = ${common.build_flags} -DFAMILY=\"host\" -DBOARD_TAG=\"native\"
