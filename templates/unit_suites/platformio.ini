; @NAME@ (./pio-box new unit_suites @NAME@): several Unity suites (test/test_*), filtered runs (-f / test_ignore), code from
; src/ under test (test_build_src), and the embedded build of the same tests without a board
; (pio test -e blackpill --without-uploading --without-testing).
;   ./pio-box utest @NAME@ -e native              all suites on the host
;   ./pio-box utest @NAME@ -e native -f test_pid  one suite
[platformio]
default_envs = native

[env]
test_framework = unity
test_build_src = yes

[env:native]
platform = platformio/native@1.2.1
build_flags = -std=gnu++17 -Wall -Wextra -Werror

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
; the app suite needs the host (it reads stdin-like input), skip it on the board
test_ignore = test_app
