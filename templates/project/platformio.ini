; @NAME@: PlatformIO project of 32_14_platformio (./pio-box build @NAME@). Platforms are pinned to the
; versions in config/platforms.tsv (./pio-box doctor checks). The .pio workspace is on $OUT
; (PLATFORMIO_WORKSPACE_DIR, set by pio-box), never in this folder.
[platformio]
default_envs = nano
; build all four: ./pio-box build . -e nano -e esp32s3 -e pico -e blackpill

[env]
framework = arduino
monitor_speed = 115200

[env:nano]
platform = platformio/atmelavr@5.3.0
board = nanoatmega328

[env:esp32s3]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1

[env:pico]
platform = platformio/raspberrypi@1.20.0
board = pico

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
upload_protocol = dfu

[env:native]
platform = platformio/native@1.2.1
framework =
test_framework = unity
build_src_filter = -<*>
