; @NAME@ (./pio-box new custom_board @NAME@): a board PlatformIO does not ship (WeAct STM32H562RGT6 core board) described in
; boards/weact_h562rg.json (MCU, variant of the STM32duino core, memory sizes, upload protocols).
; PlatformIO finds it through boards_dir. ./pio-box build custom_board
[platformio]
boards_dir = boards
default_envs = weact_h562

[env:weact_h562]
platform = platformio/ststm32@20.0.0
framework = arduino
board = weact_h562rg
upload_protocol = dfu
build_flags = -DLED_PIN=PB2
