; @NAME@ (./pio-box new esp32_fs @NAME@): a custom partition table (two 1.5 MiB OTA slots, 896 KiB LittleFS, core dump)
; and a LittleFS image built from data/ (`-t buildfs`, tool-mklittlefs pinned in config/tools.tsv).
; Upload (printed by ./pio-box plan): `-t upload` for the app, `-t uploadfs` for the file system.
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
