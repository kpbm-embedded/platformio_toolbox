; @NAME@ (./pio-box new rust_lib @NAME@): a no_std Rust crate (rust/) built as a static library by scripts/cargo.py with the pinned
; Rust of 32_17_embedded_rust and linked into C/C++ code: Unity tests on the host (native), Arduino firmware
; for the BlackPill (thumbv7em-none-eabihf) and the Pico (thumbv6m-none-eabi). PlatformIO has no Rust
; support of its own; cargo is just a pre-build step here. Without 32_17 the build stops with exit 3 (skip).
[platformio]
default_envs = native

[env]
extra_scripts = pre:scripts/cargo.py
build_flags = -Iinclude
test_framework = unity

[env:native]
platform = platformio/native@1.2.1
custom_rust_target = x86_64-unknown-linux-gnu

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
custom_rust_target = thumbv7em-none-eabihf

[env:pico]
platform = platformio/raspberrypi@1.20.0
board = pico
framework = arduino
custom_rust_target = thumbv6m-none-eabi
