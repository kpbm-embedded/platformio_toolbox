; @NAME@ (./pio-box new zig_lib @NAME@): Zig code (zig/box_zig.zig) built as a static library by scripts/zig.py with the pinned Zig
; of 32_24_microzig and linked into C/C++: Unity tests on the host (native), Arduino firmware for the
; BlackPill (thumb, cortex_m4, hard float like the STM32 core) and the ESP32-C3 (riscv32, imc). PlatformIO
; has no Zig support of its own; zig is a pre-build step here. Without 32_24 the build stops with exit 3.
[platformio]
default_envs = native

[env]
extra_scripts = pre:scripts/zig.py
build_flags = -Iinclude
test_framework = unity

[env:native]
platform = platformio/native@1.2.1
custom_zig_target = x86_64-linux-gnu

[env:blackpill]
platform = platformio/ststm32@20.0.0
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
custom_zig_target = thumb-freestanding-eabihf
custom_zig_cpu = cortex_m4

[env:esp32c3]
platform = platformio/espressif32@8.0.0
board = weactstudio_esp32c3coreboard
framework = arduino
custom_zig_target = riscv32-freestanding-none
custom_zig_cpu = generic_rv32+m+c
